<!doctype html>
<html>
  <head>
    <title>Upload Tugas</title>
  </head>
  <style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
}

.container {
  max-width: 400px;
  margin: 80px auto;
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

h2 {
  text-align: center;
  margin-bottom: 25px;
}

/* focus */
input:focus {
  border-color: #007bff;
  background: #fff;
  outline: none;
  box-shadow: 0 0 5px rgba(0,123,255,0.3);
}

/* label */
label {
  color: #333;
  margin-bottom: 5px;
  display: block;
}

/* input */
input[type="text"] {
  width: 100%;
  padding: 12px;
  margin: 8px 0 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* file upload */
input[type="file"] {
  margin-top: 5px;
  margin-bottom: 20px;
}

/* tombol */
button {
  transition: 0.2s;
  width: 100%;
  padding: 12px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 15px;
}

button:hover {
  transform: scale(1.02);
  background: #0056b3;
}

/* hasil */
#hasil {
  border: 1px solid #b7e4c7;
  margin-top: 15px;
  padding: 10px;
  background: #e6ffed;
  border-radius: 5px;
  color: #2e7d32;
}
</style>
  <body>

<div class="container">
  <h2>📤 Upload Tugas</h2>

  <form id="form">
  <label>Nama</label>
  <input type="text" id="nama" required>

  <label>NIM</label>
  <input type="text" id="nim" required>

  <label>Kelas</label>
  <input type="text" id="kelas" required>

  <label>Upload File</label>
  <input type="file" id="file" required>

  <button type="submit">Kirim</button>
</form>

    <p id="hasil"></p>

    <script>
      const form = document.getElementById("form");
      const hasil = document.getElementById("hasil");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = new FormData();
        data.append("nama", document.getElementById("nama").value);
        data.append("nim", document.getElementById("nim").value);
        data.append("kelas", document.getElementById("kelas").value);
        data.append("file", document.getElementById("file").files[0]);

        const res = await fetch("http://localhost:3000/upload", {
          method: "POST",
          body: data,
        });

        const result = await res.json();
        hasil.innerText = result.message;
      });
    </script>
  </body>
</html>
